name: zkkasir
description: Zona Kasir - aplikasi kasir mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  blue_thermal_printer: ^1.2.3
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  connectivity_plus: ^6.1.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  gal: ^2.3.0
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/menu/

# Ikon launcher digenerate dari logo brand yang sama dengan web.
# icon_launcher.png = icon.png dengan padding lebih (logo diperkecil khusus
# untuk launcher) — assets/icon.png tetap dipakai apa adanya di dalam app.
flutter_launcher_icons:
  android: true
  image_path: assets/icon_launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_launcher.png
